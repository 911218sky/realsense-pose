# Fail2Ban filter for bad bots and scanners

[Definition]
# 匹配常見的惡意爬蟲和掃描器
failregex = ^<HOST> -.*"(GET|POST|HEAD).*HTTP.*".*"(.*(?:masscan|nikto|sqlmap|nmap|dirbuster|gobuster|wpscan|acunetix|nessus|openvas|burpsuite|zgrab|censys|shodan).*)"$
            ^<HOST> -.*"(GET|POST|HEAD).*(wp-login|wp-admin|xmlrpc|phpmyadmin|admin|\.env|\.git|config\.).*HTTP.*".*$

ignoreregex =
