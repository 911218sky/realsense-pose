# API Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "realsense-pose.fullname" . }}-api
  labels:
    {{- include "realsense-pose.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "realsense-pose.api.selectorLabels" . | nindent 4 }}
---
{{- if .Values.nginx.enabled }}
# Nginx Service (main entry point)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "realsense-pose.fullname" . }}-nginx
  labels:
    {{- include "realsense-pose.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "realsense-pose.nginx.selectorLabels" . | nindent 4 }}
{{- end }}
---
{{- if .Values.mongodb.enabled }}
# MongoDB Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "realsense-pose.fullname" . }}-mongodb
  labels:
    {{- include "realsense-pose.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 27017
      targetPort: mongodb
      protocol: TCP
      name: mongodb
  selector:
    {{- include "realsense-pose.mongodb.selectorLabels" . | nindent 4 }}
{{- end }}
---
{{- if .Values.redis.enabled }}
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "realsense-pose.fullname" . }}-redis
  labels:
    {{- include "realsense-pose.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "realsense-pose.redis.selectorLabels" . | nindent 4 }}
{{- end }}
