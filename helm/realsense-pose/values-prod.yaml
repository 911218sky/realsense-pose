# =============================================================================
# RealSense Pose - Production Environment Values
# =============================================================================
# Usage: helm install realsense-pose ./helm/realsense-pose -f ./helm/realsense-pose/values-prod.yaml
#
# IMPORTANT: You MUST set mongodb.auth.rootPassword before deploying!
# Example: helm install realsense-pose ./helm/realsense-pose \
#   -f ./helm/realsense-pose/values-prod.yaml \
#   --set mongodb.auth.rootPassword=YOUR_SECURE_PASSWORD

api:
  image:
    tag: "latest"
    pullPolicy: IfNotPresent
  
  replicaCount: 2
  isProd: "1"
  
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  
  persistence:
    data:
      enabled: true
      size: 50Gi
    outputs:
      enabled: true
      size: 50Gi

nginx:
  enabled: true
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

mongodb:
  enabled: true
  auth:
    # MUST be set via --set or external secret
    rootPassword: ""
    database: "nycu_rehab"
  persistence:
    enabled: true
    size: 100Gi
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

redis:
  enabled: true
  maxmemory: "512mb"
  persistence:
    enabled: true
    size: 5Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: realsense-pose.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Uncomment and configure for HTTPS:
  # tls:
  #   - secretName: realsense-pose-tls
  #     hosts:
  #       - realsense-pose.example.com

networkPolicy:
  enabled: true

service:
  type: ClusterIP
