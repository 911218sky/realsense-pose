# =============================================================
# This workflow should be added to: 911218sky/gait-charts
# File: .github/workflows/trigger-realsense-pose.yml
# =============================================================
# When gait-charts releases a new version, it triggers
# realsense-pose to rebuild Docker image with the new web UI.
# =============================================================

name: Trigger Realsense Pose Build

on:
  release:
    types: [published]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger realsense-pose Docker build
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REALSENSE_POSE_PAT }}" \
            https://api.github.com/repos/911218sky/realsense-pose/dispatches \
            -d '{"event_type":"gait-charts-release","client_payload":{"version":"${{ github.event.release.tag_name }}"}}'

# =============================================================
# SETUP REQUIRED:
# 1. Create a Personal Access Token (PAT) with 'repo' scope
# 2. Add it as a secret named 'REALSENSE_POSE_PAT' in gait-charts repo
#    Settings > Secrets and variables > Actions > New repository secret
# =============================================================
