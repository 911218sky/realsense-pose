name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Great ideas make the project better.

  - type: dropdown
    id: component
    attributes:
      label: 🔧 Related Module
      description: Which module is this feature related to?
      options:
        - API (src/api)
        - Rehab Analyzer (src/rehab_analyzer)
        - Pose Extractor (src/realsense_pose_extractor)
        - Database (src/db)
        - CLI (src/cli.py)
        - Flutter Web UI
        - Infrastructure (Docker/Helm)
        - New Module
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 📊 Suggested Priority
      options:
        - High - Core functionality needed
        - Medium - Important improvement
        - Low - Nice to have
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🤔 Problem Statement
      description: What problem does this feature solve?
      placeholder: When using [...], I often encounter [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: How would you like this problem to be solved?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives Considered
      description: Have you considered any alternative solutions?

  - type: textarea
    id: implementation
    attributes:
      label: 🛠️ Implementation Suggestions
      description: If you have technical implementation ideas, please share
      placeholder: |
        Possible implementation:
        - Add ... to xxx.py
        - Modify API endpoint ...

  - type: textarea
    id: mockup
    attributes:
      label: 🎨 Mockups/Screenshots
      description: If UI related, please attach mockups or reference images

  - type: checkboxes
    id: contribution
    attributes:
      label: 🤝 Contribution
      options:
        - label: I am willing to help implement this feature
          required: false
        - label: I can help with testing
          required: false
