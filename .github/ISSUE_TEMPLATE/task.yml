name: 📋 Task
description: 建立開發任務或待辦事項
title: "[Task]: "
labels: ["task"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        建立一個開發任務或待辦事項。

  - type: dropdown
    id: type
    attributes:
      label: 📁 任務類型
      options:
        - Refactoring - 重構
        - Documentation - 文件
        - Testing - 測試
        - Performance - 效能優化
        - Security - 安全性
        - DevOps - 部署/CI/CD
        - Maintenance - 維護
        - Research - 研究/調查
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 🔧 相關模組
      options:
        - API (src/api)
        - Rehab Analyzer (src/rehab_analyzer)
        - Pose Extractor (src/realsense_pose_extractor)
        - Database (src/db)
        - CLI (src/cli.py)
        - Configuration (src/config)
        - Infrastructure
        - Multiple/All
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 任務描述
      description: 詳細說明這個任務的內容
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: ✅ 完成條件
      description: 列出需要完成的項目
      placeholder: |
        - [ ] 項目 1
        - [ ] 項目 2
        - [ ] 項目 3
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 📚 相關資源
      description: 相關的文件、Issue 或 PR 連結

  - type: input
    id: estimate
    attributes:
      label: ⏱️ 預估時間
      placeholder: 例如：2h, 1d, 1w
