name: 🐛 Bug Report
description: 回報程式錯誤或異常行為
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感謝你花時間回報問題！請盡可能詳細填寫以下資訊。

  - type: dropdown
    id: component
    attributes:
      label: 🔧 影響模組
      description: 這個問題發生在哪個模組？
      options:
        - API (src/api)
        - Rehab Analyzer (src/rehab_analyzer)
        - Pose Extractor (src/realsense_pose_extractor)
        - Database (src/db)
        - CLI (src/cli.py)
        - Configuration (src/config)
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 嚴重程度
      options:
        - Critical - 系統無法使用
        - High - 主要功能受影響
        - Medium - 部分功能異常
        - Low - 輕微問題
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 問題描述
      description: 清楚描述你遇到的問題
      placeholder: 發生了什麼事？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 重現步驟
      description: 如何重現這個問題？
      placeholder: |
        1. 執行 '...'
        2. 點擊 '...'
        3. 看到錯誤
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 預期行為
      description: 你預期應該發生什麼？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ 實際行為
      description: 實際發生了什麼？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📋 錯誤日誌
      description: 如果有錯誤訊息，請貼上
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: 🖥️ 環境資訊
      description: 請提供你的環境資訊
      value: |
        - OS: 
        - Python: 
        - Docker: 
        - RealSense SDK: 
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 截圖
      description: 如果適用，請附上截圖

  - type: checkboxes
    id: checklist
    attributes:
      label: ✔️ 確認事項
      options:
        - label: 我已搜尋過現有的 Issues，確認這不是重複問題
          required: true
        - label: 我已閱讀專案文件
          required: false
