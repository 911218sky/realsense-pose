worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日誌格式 - Fail2Ban 會解析這個
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 日誌輪替由 Docker 處理，這裡只設定格式
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript;

    # Rate Limiting - 基本 DDoS 防護
    # 每個 IP 每秒最多 50 個請求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    # 每個 IP 最多 20 個同時連線
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 限制請求大小
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    # 允許 header 名稱包含底線（如 x-client-id）
    underscores_in_headers on;

    upstream api_backend {
        server api:8100;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 套用 Rate Limiting
        limit_req zone=api_limit burst=100 nodelay;
        limit_conn conn_limit 20;

        # 安全標頭
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # 轉發所有原始 headers（包含認證用的 X-Client-ID, X-Signature 等）
            proxy_pass_request_headers on;

            # 超時設定
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 影片串流專用 - 支援 Range Requests 和快速切換
        location ~ ^/api/v1/realsense-pose-extractor/sessions/[^/]+/video$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header Connection "";
            proxy_pass_request_headers on;

            # 關閉 buffering 讓串流更順暢
            proxy_buffering off;
            proxy_request_buffering off;
            
            # 較長的超時給大檔案
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # 允許客戶端取消請求時立即中斷
            proxy_ignore_client_abort off;
        }

        # 健康檢查端點
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # 封鎖常見攻擊路徑
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
